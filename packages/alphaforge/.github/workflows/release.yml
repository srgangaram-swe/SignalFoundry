name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
      - name: Install locked build environment
        run: uv sync --locked --extra dev
      - name: Verify tag matches package version
        run: |
          package_version="$(uv run python -c 'import alphaforge; print(alphaforge.__version__)')"
          test "v${package_version}" = "$GITHUB_REF_NAME"
      - name: Build and smoke-test distributions
        run: |
          uv run python -m build --wheel --sdist
          python -m venv /tmp/alphaforge-release-smoke
          /tmp/alphaforge-release-smoke/bin/pip install --no-deps dist/*.whl
          /tmp/alphaforge-release-smoke/bin/python -c "from importlib.metadata import version; import alphaforge; assert version('alphaforge') == alphaforge.__version__"
          shasum -a 256 dist/* > SHA256SUMS
      - name: Retain immutable release candidate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alphaforge-${{ github.ref_name }}
          path: |
            dist/*
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists for $GITHUB_REF_NAME" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "AlphaForge $GITHUB_REF_NAME"
