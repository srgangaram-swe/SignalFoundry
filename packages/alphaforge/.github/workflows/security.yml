name: Security

on:
  push:
    branches: [main, dev, prod]
  pull_request:
    branches: [main, dev, prod]
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
      - name: Install locked audit environment
        run: uv sync --locked --extra dev --extra data --extra ml
      - name: Export hashed runtime, data, and ML dependency resolution
        run: |
          uv export \
            --frozen \
            --no-dev \
            --extra data \
            --extra ml \
            --no-emit-project \
            --format requirements-txt \
            --output-file /tmp/alphaforge-audit-requirements.txt
      - name: Audit locked dependencies against known advisories
        run: |
          uv run pip-audit \
            --strict \
            --require-hashes \
            --progress-spinner=off \
            --requirement /tmp/alphaforge-audit-requirements.txt

      - name: Export and verify hashed runtime plus development tool closure
        run: |
          uv export \
            --locked --no-dev --extra dev --no-emit-project \
            --no-header --no-annotate --format requirements-txt \
            --output-file /tmp/alphaforge-dev-audit-requirements.txt
          uv run --no-sync python -m scripts.dev_audit \
            /tmp/alphaforge-dev-audit-requirements.txt

      - name: Install clean hash-checked development audit environment
        run: |
          uv venv /tmp/alphaforge-dev-audit
          uv --no-config pip sync \
            --python /tmp/alphaforge-dev-audit/bin/python \
            --default-index https://pypi.org/simple \
            --require-hashes --only-binary :all: \
            /tmp/alphaforge-dev-audit-requirements.txt

      - name: Audit development tools without executing a second resolver
        run: |
          /tmp/alphaforge-dev-audit/bin/python -m pip_audit \
            --strict --require-hashes --disable-pip \
            --vulnerability-service pypi --timeout 15 --progress-spinner=off \
            --requirement /tmp/alphaforge-dev-audit-requirements.txt

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
