protocol_dimensions:
  configurations:
    status: frozen
    reason: >-
      The constituent strict benchmark profiles and research-governance profile
      pin every configuration that exists; absent experiments remain missing
      gates rather than being reconstructed by this retrospective synthesis.
    source_paths:
      - configs/signal_foundry_sprint_2_study.yaml
      - configs/research_governance.yaml
      - configs/deep_sequence_benchmark.yaml
      - configs/time_frequency_vision_benchmark.yaml
      - configs/latent_representation_benchmark.yaml
      - configs/ensemble_benchmark.yaml
      - configs/decision_policy.yaml
  trial_family:
    status: frozen
    reason: >-
      The committed profiles and aggregate reports identify the complete
      candidate order within each completed constituent study; the synthesis
      does not add, remove, rerun, or rank candidates across contexts.
    source_paths:
      - configs/signal_foundry_sprint_2_study.yaml
      - configs/research_governance.yaml
      - configs/deep_sequence_benchmark.yaml
      - configs/time_frequency_vision_benchmark.yaml
      - configs/latent_representation_benchmark.yaml
      - configs/ensemble_benchmark.yaml
      - configs/decision_policy.yaml
  ablations:
    status: deferred
    reason: >-
      Matched feature and parameter ablations and governed representation
      placebos were not completed in Sprint 3; Sprint 4 issue #41 owns this
      work under the same leakage-safe temporal protocol.
    source_paths: []
  randomized_controls:
    status: deferred
    reason: >-
      Feature-permutation and randomized-label controls were not completed in
      Sprint 3; Sprint 4 issue #41 owns their frozen definitions, independent
      seed streams, and matched evaluation.
    source_paths: []
  compute_budgets:
    status: frozen
    reason: >-
      Existing reports pin their measured CPU boundaries, sample counts,
      bounded configurations, and known omissions; a missing family compute
      gate remains false.
    source_paths:
      - docs/evidence/signal_foundry_sprint_2/summary.json
      - docs/evidence/signal_foundry_sprint_3/cross_repository_provenance.json
      - docs/regimes.md
      - docs/evidence/signal_foundry_sprint_3/deep_sequence/summary.json
      - docs/evidence/signal_foundry_sprint_3/time_frequency_vision/summary.json
      - docs/evidence/signal_foundry_sprint_3/latent_representations/summary.json
      - docs/evidence/signal_foundry_sprint_3/ensembles/summary.json
      - docs/evidence/signal_foundry_sprint_3/abstention_policy/summary.json
  folds:
    status: deferred
    reason: >-
      Constituent split boundaries remain pinned, but no matched per-family
      calendar-year and regime fold family with dependence-aware uncertainty
      exists; Sprint 4 issue #42 owns that temporal-stability experiment.
    source_paths:
      - configs/signal_foundry_sprint_2_study.yaml
      - configs/deep_sequence_benchmark.yaml
      - configs/time_frequency_vision_benchmark.yaml
      - configs/latent_representation_benchmark.yaml
      - configs/ensemble_benchmark.yaml
  costs:
    status: frozen
    reason: >-
      Cost policies are pinned for the constituent studies that report net
      economics; simplified diagnostics remain explicitly distinct from the
      event-driven execution simulator and absent cost evidence remains false.
    source_paths:
      - configs/signal_foundry_sprint_2_study.yaml
      - configs/deep_sequence_benchmark.yaml
      - configs/time_frequency_vision_benchmark.yaml
      - configs/ensemble_benchmark.yaml
      - configs/decision_policy.yaml
  decision_thresholds:
    status: frozen
    reason: >-
      Constituent rejection, progression, correction, and abstention rules are
      pinned by their original profiles; the final synthesis advances no
      family and has no paper, order, or capital authority.
    source_paths:
      - configs/research_governance.yaml
      - configs/signal_foundry_sprint_2_study.yaml
      - configs/time_frequency_vision_benchmark.yaml
      - configs/latent_representation_benchmark.yaml
      - configs/ensemble_benchmark.yaml
      - configs/decision_policy.yaml

synthesis_policy:
  family_order:
    - conventional_baselines
    - spectral_descriptors
    - adaptive_decomposition
    - regime_change_points
    - state_space
    - deep_sequence
    - time_frequency_vision
    - latent_representations
    - governed_ensembles
    - abstention_policy
  evidence_gates:
    - out_of_sample
    - uncertainty
    - net_economics
    - selection_correction
    - feature_ablation
    - randomized_control
    - regime_stability
    - year_stability
    - compute_accounting
  advance_requires_all_reported_gates: true
  no_cross_context_ranking: true
  final_holdout_reopened: false
  aggregate_only_publication: true
  maximum_families: 64

families:
  - family: conventional_baselines
    context: historical_engineering
    evaluated: true
    disposition: reject
    reason: >-
      The governed seven-candidate WIKI study rejected paper advancement after
      Holm-Bonferroni correction and retains stale, incomplete point-in-time
      data limitations.
    sources:
      - path: configs/signal_foundry_sprint_2_study.yaml
        sha256: e8c4c9a3bdfa85c9a783b16f01e65d9cb2563969f125adb45d289e03e49fe803
      - path: configs/research_governance.yaml
        sha256: 7cf1289e707273996eb68236c88d5072c6d1e9deb183a78725df94d786d97ed0
      - path: docs/governed_baseline_study.md
        sha256: e1bb1821538b2d649682c510581d8ffe54fd02efd948497e8c23529ba88dd3a1
      - path: docs/evidence/signal_foundry_sprint_2/summary.json
        sha256: 5aeff1e0f4c0961165ab184d2c87af594aa6c61feb49d7e3d71b17e54a6b1dbb
      - path: docs/evidence/signal_foundry_sprint_2/model_summary.csv
        sha256: 28905ce658797792c83e4d3f63b0fbe75d6a80bac7bc4123e46374c30d454d28
    gate_support:
      - gate: out_of_sample
        verdict: supported
        review_method: independent_manual_source_semantics
        assertion: >-
          The source report fixes embargoed expanding-window development folds
          before execution and the aggregate table reports the resulting
          candidate-level fold statistic.
        facts:
          - roles: [temporal_contract]
            source_path: docs/governed_baseline_study.md
            locator_kind: markdown_heading
            locator: "## Frozen boundary"
            observed: >-
              The frozen boundary defines embargoed expanding-window folds and
              a separate final-holdout date before execution.
          - roles: [result]
            source_path: docs/evidence/signal_foundry_sprint_2/model_summary.csv
            locator_kind: csv_column
            locator: mean_rank_ic
            observed: >-
              Every candidate row reports mean rank IC over the matched
              development folds.
        residual_limitations:
          - >-
            The historical panel ends in 2018 and final-holdout rows remain
            unpublished; this gate establishes the documented temporal
            evaluation boundary, not current market validity.
      - gate: uncertainty
        verdict: supported
        review_method: independent_manual_source_semantics
        assertion: >-
          Fold-level matched inference and candidate standard errors quantify
          development variability while preserving the source's low-power and
          temporal-sampling caveat.
        facts:
          - roles: [uncertainty_method]
            source_path: docs/governed_baseline_study.md
            locator_kind: markdown_heading
            locator: "## Statistical interpretation"
            observed: >-
              The report defines matched fold-level Student-t inference and
              Holm-Bonferroni correction with folds as the analysis unit.
          - roles: [result]
            source_path: docs/evidence/signal_foundry_sprint_2/model_summary.csv
            locator_kind: csv_column
            locator: rank_ic_standard_error
            observed: >-
              Candidate rows publish standard errors for their matched
              fold-level rank-IC evidence.
          - roles: [limitation]
            source_path: docs/evidence/signal_foundry_sprint_2/summary.json
            locator_kind: json_pointer
            locator: /limitations/2
            observed: >-
              The source states that matched-fold development t-tests have low
              power and depend on treating folds as the analysis unit.
        residual_limitations:
          - >-
            Eight folds provide limited power, and this variability estimate
            does not prove persistence beyond the stale engineering panel.
      - gate: net_economics
        verdict: supported
        review_method: independent_manual_source_semantics
        assertion: >-
          The pre-execution boundary fixes a common commission, spread,
          slippage, capacity, borrow, and financing policy and the aggregate
          table reports net annual return and annual cost drag.
        facts:
          - roles: [cost_policy]
            source_path: docs/governed_baseline_study.md
            locator_kind: markdown_heading
            locator: "## Frozen boundary"
            observed: >-
              The frozen boundary names the common portfolio, execution,
              commission, spread, slippage, capacity, borrow, and financing
              policy.
          - roles: [result]
            source_path: docs/evidence/signal_foundry_sprint_2/model_summary.csv
            locator_kind: csv_column
            locator: net_annual_return
            observed: >-
              Candidate rows report net annual return after the common cost
              model, alongside annual cost drag.
          - roles: [limitation]
            source_path: docs/evidence/signal_foundry_sprint_2/summary.json
            locator_kind: json_pointer
            locator: /limitations/4
            observed: >-
              The source states that backtested returns are not realized
              profits and do not establish a persistent edge.
        residual_limitations:
          - >-
            Historical engineering costs are not calibrated current execution
            costs and the result rejected paper advancement.
      - gate: selection_correction
        verdict: supported
        review_method: independent_manual_source_semantics
        assertion: >-
          The complete seven-candidate family uses Holm-Bonferroni correction
          and publishes the selected candidate's adjusted result and the
          method's limited fold-level power.
        facts:
          - roles: [selection_control]
            source_path: docs/evidence/signal_foundry_sprint_2/summary.json
            locator_kind: json_pointer
            locator: /study/correction
            observed: >-
              The complete candidate family declares Holm-Bonferroni
              family-wise correction.
          - roles: [result]
            source_path: docs/evidence/signal_foundry_sprint_2/summary.json
            locator_kind: json_pointer
            locator: /selected_candidate_evidence/adjusted_p_value
            observed: >-
              The selected linear candidate has adjusted p-value
              0.08409084120131886 and failed the multiplicity gate.
          - roles: [limitation]
            source_path: docs/evidence/signal_foundry_sprint_2/summary.json
            locator_kind: json_pointer
            locator: /limitations/2
            observed: >-
              The matched-fold correction remains low-powered because the fold
              set is small.
        residual_limitations:
          - >-
            Correction controls the declared seven-candidate family only; it
            does not cover later heterogeneous Sprint 3 experiments.
      - gate: compute_accounting
        verdict: supported
        review_method: independent_manual_source_semantics
        assertion: >-
          The aggregate source bounds the measured single-process,
          single-worker study and reports wall/CPU, memory, fit, iteration, and
          prediction totals with an explicit local-data limitation.
        facts:
          - roles: [resource_boundary]
            source_path: docs/evidence/signal_foundry_sprint_2/summary.json
            locator_kind: json_pointer
            locator: /compute/scope
            observed: >-
              Compute covers one local seven-candidate cached-bundle governed
              study.
          - roles: [result]
            source_path: docs/evidence/signal_foundry_sprint_2/summary.json
            locator_kind: json_pointer
            locator: /compute/wall_seconds
            observed: >-
              The bounded local reference reports 62.39 wall seconds and
              accompanying CPU, memory, fit, iteration, and prediction totals.
          - roles: [limitation]
            source_path: docs/evidence/signal_foundry_sprint_2/summary.json
            locator_kind: json_pointer
            locator: /limitations/0
            observed: >-
              The measured workload uses a stale cached Nasdaq WIKI panel that
              ends in 2018.
        residual_limitations:
          - >-
            One Apple-silicon laptop run is descriptive and is not a portable
            throughput or production-capacity guarantee.
    out_of_sample: true
    uncertainty: true
    net_economics: true
    selection_correction: true
    feature_ablation: false
    randomized_control: false
    regime_stability: false
    year_stability: false
    compute_accounting: true
    model_count: 7
    blocked_or_failed_count: 0

