name: CI

on:
  push:
    branches: [main, prod, dev]
  pull_request:
    branches: [main, prod, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"

jobs:
  quality:
    name: Lint, format & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify universal dependency lock
        run: uv lock --check
      - name: Ruff
        run: ruff check --output-format=github src tests scripts
      - name: Black
        run: black --check src tests scripts
      - name: Mypy
        run: mypy src

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package with development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run offline tests
        run: pytest -m "not network"

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package with development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests with branch coverage
        run: >-
          pytest -m "not network"
          --cov=quant_platform
          --cov-branch
          --cov-report=xml
          --cov-report=term-missing
          --cov-fail-under=80
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

  temporal:
    name: Temporal model (PyTorch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install temporal model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,torch]"
      - name: Exercise the temporal estimator
        run: pytest tests/test_torch_temporal.py

  mlflow-client:
    name: MLflow client integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install the bounded MLflow client extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mlflow]"
      - name: Exercise offline tracking integration
        run: PYTHONWARNINGS=error pytest tests/test_mlflow_optional_integration.py

  package:
    name: Build & distribution smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python scripts/verify_distributions.py --dist-dir dist
      - name: Install and inspect the wheel
        run: |
          python -m venv /tmp/signalattice-wheel
          /tmp/signalattice-wheel/bin/python -m pip install --upgrade pip
          /tmp/signalattice-wheel/bin/python -m pip install dist/*.whl
          /tmp/signalattice-wheel/bin/python -m pip check
          /tmp/signalattice-wheel/bin/python -c "from importlib.metadata import version; import quant_platform; assert version('signalattice') == quant_platform.__version__ == '0.2.1'"
          /tmp/signalattice-wheel/bin/signalattice version
          mkdir -p /tmp/signalattice-wheel-smoke
          cd /tmp/signalattice-wheel-smoke
          /tmp/signalattice-wheel/bin/python -I "$GITHUB_WORKSPACE/scripts/verify_distributions.py" \
            --installed-prefix /tmp/signalattice-wheel
      - name: Install and inspect the source distribution
        run: |
          python -m venv /tmp/signalattice-sdist
          /tmp/signalattice-sdist/bin/python -m pip install --upgrade pip
          /tmp/signalattice-sdist/bin/python -m pip install dist/*.tar.gz
          /tmp/signalattice-sdist/bin/python -m pip check
          /tmp/signalattice-sdist/bin/python -c "from importlib.metadata import version; import quant_platform; assert version('signalattice') == quant_platform.__version__ == '0.2.1'"
          /tmp/signalattice-sdist/bin/signalattice version
          mkdir -p /tmp/signalattice-sdist-smoke
          cd /tmp/signalattice-sdist-smoke
          /tmp/signalattice-sdist/bin/python -I "$GITHUB_WORKSPACE/scripts/verify_distributions.py" \
            --installed-prefix /tmp/signalattice-sdist
      - name: Install and inspect the optional service wheel
        run: |
          python -m venv /tmp/signalattice-service-wheel
          /tmp/signalattice-service-wheel/bin/python -m pip install --upgrade pip
          /tmp/signalattice-service-wheel/bin/python -m pip install \
            "signalattice[service] @ file://${GITHUB_WORKSPACE}/dist/signalattice-0.2.1-py3-none-any.whl"
          /tmp/signalattice-service-wheel/bin/python -m pip check
          mkdir -p /tmp/signalattice-service-wheel-smoke
          cd /tmp/signalattice-service-wheel-smoke
          /tmp/signalattice-service-wheel/bin/python -I \
            "$GITHUB_WORKSPACE/scripts/verify_distributions.py" \
            --service-prefix /tmp/signalattice-service-wheel
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  container:
    name: Build hardened container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build runtime image
        run: docker build --tag signalattice:ci .
      - name: Verify package and non-root runtime
        run: |
          docker run --rm signalattice:ci version
          docker run --rm --entrypoint python signalattice:ci -c "import os; assert os.getuid() == 10001"

  smoke:
    name: End-to-end synthetic smoke test
    runs-on: ubuntu-latest
    needs: [quality, test, coverage, temporal, package, container]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Run full pipeline on synthetic data
        run: signalattice run-full-pipeline --config configs/synthetic.yaml
      - name: Upload generated report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pipeline-report
          path: |
            reports/example/**
            reports/*.md
            reports/*.html
            reports/figures/*.png
          if-no-files-found: error

  console:
    name: Console (type-check, lint, tests, budgets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        working-directory: web
        # `npm ci` fails rather than resolving when the lockfile and manifest
        # disagree, which is the property that makes the install reproducible.
        run: npm ci
      - name: Type-check
        working-directory: web
        run: npx tsc --noEmit
      - name: Lint
        working-directory: web
        run: npx eslint . --max-warnings 0
      - name: Unit and component tests with branch coverage
        working-directory: web
        run: npx vitest run --coverage
      - name: Build
        working-directory: web
        run: npm run build
      - name: OpenAPI contract drift
        working-directory: web
        # Regenerates the bindings and compares them byte for byte: types that
        # drifted from the served contract compile happily and then render
        # fields the service does not send.
        run: npm run api:check
      - name: Resource budgets
        working-directory: web
        run: npm run budget
      - name: Two builds are byte-identical
        working-directory: web
        # A bundle whose bytes change without its inputs changing cannot be
        # attested to later.
        run: |
          set -eu
          find dist -type f -exec sha256sum {} + | sed 's| dist/| |' | sort > /tmp/build-a.txt
          npm run build
          find dist -type f -exec sha256sum {} + | sed 's| dist/| |' | sort > /tmp/build-b.txt
          diff -u /tmp/build-a.txt /tmp/build-b.txt
      - name: Reject generated or oversized artifacts in the tree
        run: |
          set -eu
          if git ls-files --error-unmatch web/dist web/node_modules web/coverage >/dev/null 2>&1; then
            echo "generated console output must not be committed" >&2
            exit 1
          fi

  console-browser:
    name: Console browser and accessibility tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        working-directory: web
        run: npm ci
      - name: Install browsers
        working-directory: web
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build
        working-directory: web
        run: npm run build
      - name: Browser matrix, keyboard, and axe
        working-directory: web
        run: npx playwright test
        env:
          CI: "1"
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
