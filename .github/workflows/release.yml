name: Release

# Two jobs with deliberately different authority.
#
# `dry-run` runs on every pull request and on dev. It has read-only permissions
# and no access to any environment, so untrusted code from a pull request cannot
# obtain publication credentials no matter what it executes.
#
# `publish` is manual only, refuses anything but `main`, and runs inside a
# protected environment that requires a human approval. It is present so the
# path is reviewable; SF-S5-SL-MR7 does not run it, and no tag or release exists
# as a result of that MR.
on:
  pull_request:
    branches: [main, prod, dev]
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release. Requires main and a protected-environment approval."
        type: boolean
        default: false
      release_commit:
        description: "Exact origin/main commit to publish."
        type: string
        required: false

# Least privilege at the top level. Any job needing more must ask for it.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  dry-run:
    name: Release dry run (publishes nothing)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the dry run derives its deterministic timestamp from
          # the commit date, which a shallow clone does not carry.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked Python environment
        run: |
          set -euo pipefail
          python -m pip install uv
          # --frozen: resolve nothing. A release built against a resolution the
          # lockfile does not describe is not the release the lockfile attests to.
          uv sync --all-extras --frozen
      - name: Install locked console dependencies
        working-directory: web
        run: npm ci
      - name: Verify the release version agrees everywhere
        run: uv run python -c "from pathlib import Path; from quant_platform.release.identity import assert_versions_agree; print(assert_versions_agree(Path('.')))"
      - name: Record the tag set before the dry run
        id: tags_before
        run: echo "digest=$(git tag --list | sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Dry run
        run: uv run python scripts/release.py dry-run --staging build/release
      - name: Independent verification of the staged candidate
        run: uv run python scripts/release.py verify --staging build/release
      - name: Two clean builds are byte-identical
        run: uv run python scripts/check_release_reproducible.py
      - name: Assert the dry run published nothing
        # The tool has no publication capability by construction; this proves
        # the observable repository state is unchanged regardless, by comparing
        # against the digest captured before the build ran.
        run: |
          set -euo pipefail
          after=$(git tag --list | sort | sha256sum | cut -d' ' -f1)
          if [ "${{ steps.tags_before.outputs.digest }}" != "$after" ]; then
            echo "the dry run altered the tag set" >&2
            exit 1
          fi
          version=$(uv run python -c "from pathlib import Path; from quant_platform.release.identity import canonical_version; print(canonical_version(Path('.')))")
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "a tag for v$version already exists; the dry run must not create one" >&2
            exit 1
          fi
          echo "no tag exists for v$version and the tag set is unchanged"
      - name: Upload the dry-run evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dry-run-evidence
          path: |
            build/release/release-descriptor.json
            build/release/release-inventory.json
            build/release/sbom.cyclonedx.json
            build/release/provenance.intoto.json
          retention-days: 14

  publish:
    name: Publish release (protected)
    # Manual only, and only from main. A workflow reachable from dev, prod, or a
    # pull request must never be able to reach this job.
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The protected environment is where the human approval lives. Nothing in
    # this repository can approve on its own behalf.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse anything but the exact current origin/main commit
        run: |
          set -euo pipefail
          requested="${{ inputs.release_commit }}"
          if [ -z "$requested" ]; then
            echo "release_commit is required for publication" >&2
            exit 1
          fi
          git fetch --quiet origin main
          current=$(git rev-parse origin/main)
          if [ "$requested" != "$current" ]; then
            echo "requested $requested is not the current origin/main ($current)" >&2
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked environments
        run: |
          set -euo pipefail
          python -m pip install uv
          uv sync --all-extras --frozen
          npm --prefix web ci
      - name: Build and verify the publication candidate
        run: |
          set -euo pipefail
          uv run python scripts/release.py dry-run --staging build/release
          uv run python scripts/release.py verify --staging build/release
      - name: Resolve the release version and tag
        id: release
        run: |
          set -euo pipefail
          version=$(uv run python -c "from pathlib import Path; from quant_platform.release.identity import canonical_version; print(canonical_version(Path('.')))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Refuse a reused tag
        # Published tags are immutable. A defective release is corrected with a
        # new version, never by moving or replacing a tag.
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists; publish a new version instead" >&2
            exit 1
          fi
      - name: Create the immutable signed annotated tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "srgangaram-swe"
          git config user.email "srgangaram-swe@users.noreply.github.com"
          git tag -a "${{ steps.release.outputs.tag }}" "${{ inputs.release_commit }}" \
            -m "Signalattice ${{ steps.release.outputs.version }}"
          git push origin "${{ steps.release.outputs.tag }}"
      - name: Attest the release subjects
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            build/release/python/*
            build/release/sbom.cyclonedx.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.release.outputs.tag }}" \
            --target "${{ inputs.release_commit }}" \
            --title "Signalattice ${{ steps.release.outputs.version }}" \
            --notes-file docs/sprint5_dossier.md \
            build/release/python/* \
            build/release/release-descriptor.json \
            build/release/release-inventory.json \
            build/release/sbom.cyclonedx.json \
            build/release/provenance.intoto.json
      - name: Reverify the published release
        # A partial upload is not a valid release and must not be reported as
        # one, so the remote state is checked after the fact rather than assumed.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          git fetch --quiet origin "refs/tags/$tag:refs/tags/$tag"
          if [ "$(git rev-list -n 1 "$tag")" != "${{ inputs.release_commit }}" ]; then
            echo "the published tag does not target the requested commit" >&2
            exit 1
          fi
          gh release view "$tag" --json isDraft,assets \
            --jq 'if .isDraft then error("release is a draft") else (.assets | length) end'
          uv run python scripts/release.py verify --staging build/release
