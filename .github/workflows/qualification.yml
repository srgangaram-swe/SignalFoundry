        : dict(sorted(problem_codes.items())),\n        \"data_status_counts\": dict(sorted(counts.items())),\n\
        \        \"docker_healthcheck_recovered\": False,\n        \"liveness_latency_ms\": live_latency,\n\
        \        \"liveness_status\": live_status,\n        \"pids_headroom\": maximum - peak,\n     \
        \   \"pids_limit\": maximum,\n        \"pids_peak\": peak,\n        \"readiness_code\": ready_code,\n\
        \        \"readiness_latency_ms\": ready_latency,\n        \"readiness_retry_after_seconds\":\
        \ int(ready_retry_after),\n        \"readiness_retryable\": ready_retryable,\n        \"readiness_status\"\
