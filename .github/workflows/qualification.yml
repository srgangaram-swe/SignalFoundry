    - name: Set up Node
      uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
      with:
        node-version-file: packages/signalattice/web/.nvmrc
        cache: npm
        cache-dependency-path: packages/signalattice/web/package-lock.json
    - name: Install locked dependencies
      working-directory: packages/signalattice/web
      run: npm ci
    - name: Type-check
      working-directory: packages/signalattice/web
      run: npx tsc --noEmit
    - name: Lint
      working-directory: packages/signalattice/web
      run: npx eslint . --max-warnings 0
    - name: Unit and component tests with branch coverage
      working-directory: packages/signalattice/web
      run: npx vitest run --coverage
    - name: Build
      working-directory: packages/signalattice/web
      run: npm run build
    - name: OpenAPI contract drift
      working-directory: packages/signalattice/web
      run: npm run api:check
    - name: Resource budgets
      working-directory: packages/signalattice/web
      run: npm run budget
    - name: Two builds are byte-identical
      working-directory: packages/signalattice/web
      run: 'set -eu

        find dist -type f -exec sha256sum {} + | sed ''s| dist/| |'' | sort > /tmp/build-a.txt

        npm run build

        find dist -type f -exec sha256sum {} + | sed ''s| dist/| |'' | sort > /tmp/build-b.txt

        diff -u /tmp/build-a.txt /tmp/build-b.txt

        '
    - name: Reject generated or oversized artifacts in the tree
      run: "set -eu\nif git ls-files --error-unmatch web/dist web/node_modules web/coverage >/dev/null\
        \ 2>&1; then\n  echo \"generated console output must not be committed\" >&2\n  exit 1\nfi\n"
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/signalattice
