      run: 'set -euo pipefail

        source_date_epoch="$(git show -s --format=%ct HEAD)"

        [[ "$source_date_epoch" =~ ^[0-9]{9,12}$ ]]

        canary="SF_CONTAINER_CANARY_$(openssl rand -hex 32)"

        echo "::add-mask::$canary"

        echo "SOURCE_DATE_EPOCH=$source_date_epoch" >> "$GITHUB_ENV"

        echo "SERVICE_SECRET_CANARY=$canary" >> "$GITHUB_ENV"

        evidence_dir="$RUNNER_TEMP/service-evidence"

        mkdir -p "$evidence_dir"

        chmod 0700 "$evidence_dir"

        echo "EVIDENCE_DIR=$evidence_dir" >> "$GITHUB_ENV"

        '
