        # attestation makes buildx emit an image index, which the docker\n# exporter cannot --load; and\
        \ its per-build startedOn/finishedOn\n# timestamps would land in the index digest, making the\
        \ A/B\n# reproducibility comparison unable to pass by construction. Nothing\n# consumes the attestation:\
        \ verify_service_container.py reads build\n# metadata digests and the benchmark's own provenance\
        \ block.\ndocker buildx build \\\n  --platform \"$DECLARED_PLATFORM\" \\\n  --target service \\\
        \n  --pull \\\n  --no-cache \\\n  --provenance=false \\\n  --build-arg \"SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH\"\
        \ \\\n  --build-arg \"VCS_REF=$GITHUB_SHA\" \\\n  --metadata-file \"$EVIDENCE_DIR/build-a-metadata.json\"\
        \ \\\n  --tag \"$SERVICE_IMAGE_A\" \\\n  --load \\\n  .\n"
    - name: Build clean service image B without cache
      shell: bash
      run: "set -euo pipefail\n# provenance=false matches the CLI and test builds. A max provenance\n\
        # attestation makes buildx emit an image index, which the docker\n# exporter cannot --load; and\
        \ its per-build startedOn/finishedOn\n# timestamps would land in the index digest, making the\
        \ A/B\n# reproducibility comparison unable to pass by construction. Nothing\n# consumes the attestation:\
        \ verify_service_container.py reads build\n# metadata digests and the benchmark's own provenance\
        \ block.\ndocker buildx build \\\n  --platform \"$DECLARED_PLATFORM\" \\\n  --target service \\\
