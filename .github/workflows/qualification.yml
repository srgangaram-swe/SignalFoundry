        \ /tmp:rw,noexec,nosuid,nodev,size=1048576,mode=1770,uid=10001,gid=10001 \\\n  --mount \"type=bind,src=$runtime_root,dst=/state\"\
        \ \\\n  --entrypoint python \\\n  \"$CLI_IMAGE\" - > \"$EVIDENCE_DIR/lock-helper.log\" 2>&1 <<'PY'\
        \ &\nimport sqlite3\nimport time\nfrom pathlib import Path\n\nroot = Path(\"/state\")\nready =\
