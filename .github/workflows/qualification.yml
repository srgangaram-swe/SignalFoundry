    - name: Expose isolated package environment
      run: echo "$GITHUB_WORKSPACE/packages/signalattice/.venv/bin" >> "$GITHUB_PATH"
    - name: Set up Node
      uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
      with:
        node-version-file: packages/signalattice/web/.nvmrc
        cache: npm
        cache-dependency-path: packages/signalattice/web/package-lock.json
    - name: Install locked Python environment
      run: 'set -euo pipefail

        uv --version

        # --frozen: resolve nothing. A release built against a resolution the

        # lockfile does not describe is not the release the lockfile attests to.

