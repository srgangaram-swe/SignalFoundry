        \            if len(body) > expected_body_bytes:\n                raise RuntimeError(\"response\
        \ body exceeded its declared length\")\n        if len(body) != expected_body_bytes:\n       \
        \     raise RuntimeError(\"response body was truncated\")\n        status = int(first_line[1])\n\
        \        problem_code = None\n        retryable = None\n        if status in {429, 503}:\n   \
        \         try:\n                problem = json.loads(body)\n            except (UnicodeDecodeError,\
        \ json.JSONDecodeError) as exc:\n                raise RuntimeError(\"problem response was invalid\"\
