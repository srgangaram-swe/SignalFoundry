        \ \"$container_id\" python - \\\n  > \"$EVIDENCE_DIR/runtime-saturation.json\" <<'PY'\nimport\
        \ asyncio\nimport collections\nimport json\nimport time\nfrom pathlib import Path\n\nSOCKET_PATH\
        \ = \"/run/signalattice/api.sock\"\nSUBMITTED = 48\n\n\ndef current_pids() -> tuple[int, int]:\n\
        \    for root in (Path(\"/sys/fs/cgroup\"), Path(\"/sys/fs/cgroup/pids\")):\n        current_path\
        \ = root / \"pids.current\"\n        maximum_path = root / \"pids.max\"\n        if current_path.is_file()\
        \ and maximum_path.is_file():\n            current = int(current_path.read_text(encoding=\"ascii\"\
        ).strip())\n            maximum = int(maximum_path.read_text(encoding=\"ascii\").strip())\n  \
        \          return current, maximum\n    raise RuntimeError(\"PID controller is unavailable\")\n\
        \n\nasync def request(\n    path: str,\n) -> tuple[int, str | None, bool | None, str | None, float]:\n\
        \    started = time.perf_counter_ns()\n    reader, writer = await asyncio.wait_for(\n        asyncio.open_unix_connection(SOCKET_PATH),\
        \ timeout=1.0\n    )\n    try:\n        writer.write(\n            f\"GET {path} HTTP/1.1\\r\\\
        nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\".encode(\n                \"ascii\"\n   \
        \         )\n        )\n        await writer.drain()\n        response = bytearray()\n       \
        \ while b\"\\r\\n\\r\\n\" not in response:\n            chunk = await asyncio.wait_for(reader.read(4096),\
        \ timeout=2.0)\n            if not chunk:\n                break\n            response.extend(chunk)\n\
        \            if len(response) > 65_536:\n                raise RuntimeError(\"response header\
        \ exceeded its test bound\")\n        header, separator, body = bytes(response).partition(b\"\\\
        r\\n\\r\\n\")\n        if not separator:\n            raise RuntimeError(\"response header was\
