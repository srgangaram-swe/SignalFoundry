        \ (\n            status,\n            problem_code,\n            retryable,\n            retry_after,\n\
        \            (time.perf_counter_ns() - started) / 1_000_000.0,\n        )\n    finally:\n    \
        \    writer.close()\n        await writer.wait_closed()\n\n\nasync def main() -> dict[str, object]:\n\
        \    tasks = [\n        asyncio.create_task(request(\"/api/v1/runs?page_size=1\"))\n        for\
        \ _ in range(SUBMITTED)\n    ]\n    peak, maximum = current_pids()\n    deadline = time.monotonic()\
        \ + 1.0\n    saw_rejection = False\n    while time.monotonic() < deadline:\n        peak = max(peak,\
        \ current_pids()[0])\n        for task in tasks:\n            if task.done() and not task.cancelled():\n\
