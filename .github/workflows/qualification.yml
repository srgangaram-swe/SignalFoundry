        code\"), str\n            ):\n                raise RuntimeError(\"problem response lacked a stable\
        \ code\")\n            problem_code = problem[\"code\"]\n            retryable_value = problem.get(\"\
        retryable\")\n            if retryable_value is not None and type(retryable_value) is not bool:\n\
        \                raise RuntimeError(\"response retryability was invalid\")\n            retryable\
        \ = retryable_value\n        retry_after_bytes = headers.get(b\"retry-after\")\n        try:\n\
