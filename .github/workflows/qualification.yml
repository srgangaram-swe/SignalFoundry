        \narchive_bytes=\"$(stat --format=%s \"$scan_root/service-image.tar\")\"\n[[ \"$archive_bytes\"\
        \ =~ ^[0-9]+$ ]]\n[[ \"$archive_bytes\" -le 1342177280 ]]\nmanifest_digest=\"$(python - \"$EVIDENCE_DIR/container-summary.json\"\
        \ <<'PY'\nimport json\nimport sys\nfrom pathlib import Path\n\ndocument = json.loads(Path(sys.argv[1]).read_text(encoding=\"\
