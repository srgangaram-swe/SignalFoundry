        \        live_retry_after,\n        live_latency,\n    ) = await request(\"/health/live\")\n \
        \   (\n        ready_status,\n        ready_code,\n        ready_retryable,\n        ready_retry_after,\n\
        \        ready_latency,\n    ) = await request(\"/health/ready\")\n    results = await asyncio.wait_for(asyncio.gather(*tasks),\
        \ timeout=3.0)\n    peak = max(peak, current_pids()[0])\n    counts = collections.Counter(str(status)\
        \ for status, *_ in results)\n    problem_codes = collections.Counter(\n        code for _, code,\
        \ *_ in results if code is not None\n    )\n    if (\n        set(counts) != {\"429\", \"503\"\
        }\n        or counts[\"429\"] < 1\n        or counts[\"503\"] < 1\n        or set(problem_codes)\n\
        \        - {\"evidence_unavailable\", \"service_saturated\"}\n        or problem_codes[\"service_saturated\"\
        ] != counts[\"429\"]\n        or problem_codes[\"evidence_unavailable\"] != counts[\"503\"]\n\
        \        or any(\n            retryable is not None or retry_after != \"1\"\n            for _,\
        \ _, retryable, retry_after, _ in results\n        )\n        or live_status != 200\n        or\
        \ live_code is not None\n        or live_retryable is not None\n        or live_retry_after is\
        \ not None\n        or ready_status != 503\n        or ready_code != \"registry_busy\"\n     \
        \   or ready_retryable is not True\n        or ready_retry_after != \"1\"\n        or live_latency\
        \ > 250.0\n        or ready_latency > 1_000.0\n        or peak > 60\n    ):\n        raise RuntimeError(\"\
