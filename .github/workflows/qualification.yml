        PRAGMA locking_mode=EXCLUSIVE\")\n    connection.execute(\"BEGIN EXCLUSIVE\")\n    ready.write_text(\"\
        locked\\n\", encoding=\"ascii\")\n    ready.chmod(0o600)\n    time.sleep(5.0)\nfinally:\n    if\
        \ connection.in_transaction:\n        connection.rollback()\n    connection.close()\n    ready.unlink(missing_ok=True)\n\
