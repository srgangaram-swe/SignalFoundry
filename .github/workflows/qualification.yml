# Generated by python -m foundry_build.workflows; review gate adapters.
name: Signal Foundry qualification
'on':
  push:
    branches:
    - dev
    - prod
    - main
  pull_request:
    branches:
    - dev
    - prod
    - main
permissions:
  contents: read
concurrency:
  group: qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  alphaforge-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Verify offline package provenance context
      working-directory: .
      run: python3 -m foundry_build.context alphaforge
    - name: Set up Python 3.12
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Set up uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        version: 0.11.28
    - name: Install locked environment
      run: uv sync --locked --extra dev --extra data
    - name: Repository policy hooks
      run: uv run python -m pre_commit run --all-files
    - name: Validate committed configurations
      run: uv run python scripts/validate_configs.py
    - name: Type check (mypy)
      run: uv run python -m mypy alphaforge tests scripts apps benchmarks
    - name: Build and install wheel
      run: 'uv run python -m build --wheel --sdist

        python -m venv /tmp/alphaforge-wheel-smoke

        /tmp/alphaforge-wheel-smoke/bin/pip install --no-deps dist/*.whl

        /tmp/alphaforge-wheel-smoke/bin/python -c "from importlib.metadata import version; import alphaforge;
        assert version(''alphaforge'') == alphaforge.__version__ == ''0.3.0''"

        '
    name: 'alphaforge: quality'
    defaults:
      run:
        working-directory: packages/alphaforge
    env: {}
  alphaforge-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.12'
        - '3.13'
        - '3.14'
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Verify offline package provenance context
      working-directory: .
      run: python3 -m foundry_build.context alphaforge
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        version: 0.11.28
    - name: Install locked environment
      run: uv sync --locked --extra dev --extra data --extra torch
    - name: Build C++ execution core
      run: uv run python scripts/build_native.py
    - name: Tests (network tests excluded; includes C++/Python parity)
      run: uv run python -m pytest -m "not network" --cov=alphaforge --cov-branch --cov-report=term-missing
        --cov-fail-under=78
    name: 'alphaforge: test (Python ${{ matrix.python-version }})'
    defaults:
      run:
        working-directory: packages/alphaforge
    env: {}
  alphaforge-optional-extras:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
        - extra: data
          imports: import pyarrow, yfinance
        - extra: ml
          imports: import catboost, lightgbm, xgboost
        - extra: app
          imports: import fastapi, plotly, streamlit, uvicorn
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Verify offline package provenance context
      working-directory: .
      run: python3 -m foundry_build.context alphaforge
    - name: Set up Python 3.12
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Set up uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        version: 0.11.28
    - name: Install locked ${{ matrix.extra }} extra
      run: uv sync --locked --extra dev --extra "${{ matrix.extra }}"
    - name: Import optional dependency boundary
      env:
        OPTIONAL_IMPORTS: ${{ matrix.imports }}
      run: uv run python -c "$OPTIONAL_IMPORTS"
    - name: Governed optional model contract
      if: matrix.extra == 'ml'
      run: uv run python -m pytest tests/test_optional_boosters.py
    - name: Application API and version contract
      if: matrix.extra == 'app'
      run: uv run python -m pytest tests/test_backtest_ui.py
    name: 'alphaforge: optional-extras (${{ matrix.extra }})'
    defaults:
      run:
        working-directory: packages/alphaforge
    env: {}
  alphaforge-smoke-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Verify offline package provenance context
      working-directory: .
      run: python3 -m foundry_build.context alphaforge
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Set up uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        version: 0.11.28
    - name: Install locked environment
      run: uv sync --locked
    - name: End-to-end synthetic pipeline
      run: 'uv run python scripts/run_walk_forward.py --synthetic --fast

        uv run python scripts/run_backtest.py --latest

        uv run python scripts/generate_report.py

        '
    name: 'alphaforge: smoke-demo'
    defaults:
      run:
        working-directory: packages/alphaforge
    env: {}
  alphaforge-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Verify offline package provenance context
      working-directory: .
      run: python3 -m foundry_build.context alphaforge
    - name: Build hardened data-excluding image
      run: docker build --tag alphaforge:ci .
    - name: Verify package and native core
      run: "docker run --rm --entrypoint python alphaforge:ci -c \\\n  \"import alphaforge; from alphaforge.execution\
        \ import NATIVE_AVAILABLE; assert alphaforge.__version__ == '0.3.0'; assert NATIVE_AVAILABLE\"\
        \n"
    name: 'alphaforge: container'
    defaults:
      run:
        working-directory: packages/alphaforge
    env: {}
  alphaforge-dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Verify offline package provenance context
      working-directory: .
      run: python3 -m foundry_build.context alphaforge
    - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
      with:
        fail-on-severity: moderate
        comment-summary-in-pr: never
    name: 'alphaforge: dependency-review'
    defaults:
      run:
        working-directory: packages/alphaforge
    env: {}
  alphaforge-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Verify offline package provenance context
      working-directory: .
      run: python3 -m foundry_build.context alphaforge
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        version: 0.11.28
    - name: Install locked audit environment
      run: uv sync --locked --extra dev --extra data --extra ml
    - name: Export hashed runtime, data, and ML dependency resolution
      run: "uv export \\\n  --frozen \\\n  --no-dev \\\n  --extra data \\\n  --extra ml \\\n  --no-emit-project\
        \ \\\n  --format requirements-txt \\\n  --output-file /tmp/alphaforge-audit-requirements.txt\n"
    - name: Audit locked dependencies against known advisories
      run: "uv run pip-audit \\\n  --strict \\\n  --require-hashes \\\n  --progress-spinner=off \\\n \
        \ --requirement /tmp/alphaforge-audit-requirements.txt\n"
    - name: Export and verify hashed runtime plus development tool closure
      run: "uv export \\\n  --locked --no-dev --extra dev --no-emit-project \\\n  --no-header --no-annotate\
        \ --format requirements-txt \\\n  --output-file /tmp/alphaforge-dev-audit-requirements.txt\nuv\
        \ run --no-sync python -m scripts.dev_audit \\\n  /tmp/alphaforge-dev-audit-requirements.txt\n"
    - name: Install clean hash-checked development audit environment
      run: "uv venv /tmp/alphaforge-dev-audit\nuv --no-config pip sync \\\n  --python /tmp/alphaforge-dev-audit/bin/python\
        \ \\\n  --default-index https://pypi.org/simple \\\n  --require-hashes --only-binary :all: \\\n\
        \  /tmp/alphaforge-dev-audit-requirements.txt\n"
    - name: Audit development tools without executing a second resolver
      run: "/tmp/alphaforge-dev-audit/bin/python -m pip_audit \\\n  --strict --require-hashes --disable-pip\
        \ \\\n  --vulnerability-service pypi --timeout 15 --progress-spinner=off \\\n  --requirement /tmp/alphaforge-dev-audit-requirements.txt\n"
    name: 'alphaforge: dependency-audit'
    defaults:
      run:
        working-directory: packages/alphaforge
    env: {}
  alphaforge-secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Verify offline package provenance context
      working-directory: .
      run: python3 -m foundry_build.context alphaforge
    - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    name: 'alphaforge: secret-scan'
    defaults:
      run:
        working-directory: packages/alphaforge
    env: {}
  signalattice-quality:
    name: 'signalattice: Lint, format & type-check'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Verify offline package provenance context
      working-directory: .
      run: python3 -m foundry_build.context signalattice
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        version: 0.11.32
    - name: Expose isolated package environment
      run: echo "$GITHUB_WORKSPACE/packages/signalattice/.venv/bin" >> "$GITHUB_PATH"
    - name: Install development dependencies
      run: 'uv sync --locked --extra dev

        '
    - name: Verify universal dependency lock
      run: uv lock --check
    - name: Ruff
      run: ruff check --output-format=github src tests scripts
    - name: Black
      run: black --check src tests scripts
    - name: Mypy
      run: mypy src
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/signalattice
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONHASHSEED: '0'
  signalattice-test:
    name: 'signalattice: Tests (Python ${{ matrix.python-version }})'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.12'
        - '3.13'
        - '3.14'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Verify offline package provenance context
      working-directory: .
      run: python3 -m foundry_build.context signalattice
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: ${{ matrix.python-version }}
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        version: 0.11.32
    - name: Expose isolated package environment
      run: echo "$GITHUB_WORKSPACE/packages/signalattice/.venv/bin" >> "$GITHUB_PATH"
    - name: Install package with development dependencies
      run: 'uv sync --locked --extra dev

        '
    - name: Run offline tests
      run: pytest -m "not network"
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/signalattice
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONHASHSEED: '0'
  signalattice-coverage:
    name: 'signalattice: Coverage gate'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Verify offline package provenance context
      working-directory: .
      run: python3 -m foundry_build.context signalattice
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        version: 0.11.32
    - name: Expose isolated package environment
      run: echo "$GITHUB_WORKSPACE/packages/signalattice/.venv/bin" >> "$GITHUB_PATH"
    - name: Install package with development dependencies
      run: 'uv sync --locked --extra dev

        '
    - name: Run tests with branch coverage
      run: pytest -m "not network" --cov=quant_platform --cov-branch --cov-report=xml --cov-report=term-missing
        --cov-fail-under=80
    - name: Upload coverage artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: signalattice-coverage-report
        path: packages/signalattice/coverage.xml
        if-no-files-found: error
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/signalattice
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONHASHSEED: '0'
  signalattice-temporal:
    name: 'signalattice: Temporal model (PyTorch)'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Verify offline package provenance context
      working-directory: .
      run: python3 -m foundry_build.context signalattice
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        version: 0.11.32
    - name: Expose isolated package environment
      run: echo "$GITHUB_WORKSPACE/packages/signalattice/.venv/bin" >> "$GITHUB_PATH"
    - name: Install temporal model dependencies
      run: 'uv sync --locked --extra dev --extra torch

        '
    - name: Exercise the temporal estimator
      run: pytest tests/test_torch_temporal.py
    defaults:
      run:
        working-directory: packages/signalattice
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONHASHSEED: '0'
  signalattice-mlflow-client:
    name: 'signalattice: MLflow client integration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Verify offline package provenance context
      working-directory: .
      run: python3 -m foundry_build.context signalattice
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        version: 0.11.32
    - name: Expose isolated package environment
      run: echo "$GITHUB_WORKSPACE/packages/signalattice/.venv/bin" >> "$GITHUB_PATH"
    - name: Install the bounded MLflow client extra
      run: 'uv sync --locked --extra dev --extra mlflow

        '
    - name: Exercise offline tracking integration
      run: PYTHONWARNINGS=error pytest tests/test_mlflow_optional_integration.py
    defaults:
      run:
        working-directory: packages/signalattice
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONHASHSEED: '0'
  signalattice-package:
    name: 'signalattice: Build & distribution smoke tests'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Verify offline package provenance context
      working-directory: .
      run: python3 -m foundry_build.context signalattice
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        version: 0.11.32
    - name: Expose isolated package environment
      run: echo "$GITHUB_WORKSPACE/packages/signalattice/.venv/bin" >> "$GITHUB_PATH"
    - name: Resolve the canonical release version
      id: version
      run: 'set -euo pipefail

        version=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path(''pyproject.toml'').read_text())[''project''][''version''])")

        echo "value=$version" >> "$GITHUB_OUTPUT"

        echo "canonical release version: $version"

        '
    - name: Build distributions
      run: 'uv sync --locked --extra dev

        python -m build

        python scripts/verify_distributions.py --dist-dir dist

        '
    - name: Install and inspect the wheel
      run: "python -m venv /tmp/signalattice-wheel\n/tmp/signalattice-wheel/bin/python -m pip install\
        \ --upgrade pip\n/tmp/signalattice-wheel/bin/python -m pip install dist/*.whl\n/tmp/signalattice-wheel/bin/python\
        \ -m pip check\n/tmp/signalattice-wheel/bin/python -c \"from importlib.metadata import version;\
        \ import quant_platform; assert version('signalattice') == quant_platform.__version__ == '${{\
        \ steps.version.outputs.value }}'\"\n/tmp/signalattice-wheel/bin/signalattice version\nmkdir -p\
        \ /tmp/signalattice-wheel-smoke\ncd /tmp/signalattice-wheel-smoke\n/tmp/signalattice-wheel/bin/python\
        \ -I \"$GITHUB_WORKSPACE/packages/signalattice/scripts/verify_distributions.py\" \\\n  --installed-prefix\
        \ /tmp/signalattice-wheel\n"
    - name: Install and inspect the source distribution
      run: "python -m venv /tmp/signalattice-sdist\n/tmp/signalattice-sdist/bin/python -m pip install\
        \ --upgrade pip\n/tmp/signalattice-sdist/bin/python -m pip install dist/*.tar.gz\n/tmp/signalattice-sdist/bin/python\
        \ -m pip check\n/tmp/signalattice-sdist/bin/python -c \"from importlib.metadata import version;\
        \ import quant_platform; assert version('signalattice') == quant_platform.__version__ == '${{\
        \ steps.version.outputs.value }}'\"\n/tmp/signalattice-sdist/bin/signalattice version\nmkdir -p\
        \ /tmp/signalattice-sdist-smoke\ncd /tmp/signalattice-sdist-smoke\n/tmp/signalattice-sdist/bin/python\
        \ -I \"$GITHUB_WORKSPACE/packages/signalattice/scripts/verify_distributions.py\" \\\n  --installed-prefix\
        \ /tmp/signalattice-sdist\n"
    - name: Install and inspect the optional service wheel
      run: "python -m venv /tmp/signalattice-service-wheel\n/tmp/signalattice-service-wheel/bin/python\
        \ -m pip install --upgrade pip\n/tmp/signalattice-service-wheel/bin/python -m pip install \\\n\
        \  \"signalattice[service] @ file://${GITHUB_WORKSPACE}/packages/signalattice/dist/signalattice-${{\
        \ steps.version.outputs.value }}-py3-none-any.whl\"\n/tmp/signalattice-service-wheel/bin/python\
        \ -m pip check\nmkdir -p /tmp/signalattice-service-wheel-smoke\ncd /tmp/signalattice-service-wheel-smoke\n\
        /tmp/signalattice-service-wheel/bin/python -I \\\n  \"$GITHUB_WORKSPACE/packages/signalattice/scripts/verify_distributions.py\"\
        \ \\\n  --service-prefix /tmp/signalattice-service-wheel\n"
    - name: Upload distributions
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: signalattice-python-distributions
        path: packages/signalattice/dist/*
        if-no-files-found: error
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/signalattice
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONHASHSEED: '0'
  signalattice-container:
    name: 'signalattice: Build hardened container'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Verify offline package provenance context
      working-directory: .
      run: python3 -m foundry_build.context signalattice
    - name: Build runtime image
      run: docker build --tag signalattice:ci .
    - name: Verify package and non-root runtime
      run: 'docker run --rm signalattice:ci version

        docker run --rm --entrypoint python signalattice:ci -c "import os; assert os.getuid() == 10001"

        '
    defaults:
      run:
        working-directory: packages/signalattice
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONHASHSEED: '0'
  signalattice-smoke:
    name: 'signalattice: End-to-end synthetic smoke test'
    runs-on: ubuntu-latest
    needs:
    - signalattice-quality
    - signalattice-test
    - signalattice-coverage
    - signalattice-temporal
    - signalattice-package
    - signalattice-container
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Verify offline package provenance context
      working-directory: .
      run: python3 -m foundry_build.context signalattice
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        version: 0.11.32
    - name: Expose isolated package environment
