[build-system]
requires = ["setuptools>=77", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-foundry"
version = "0.3.0"
description = "Local-first quantitative research control plane and provenance tooling"
requires-python = ">=3.12"
authors = [{name = "srgangaram-swe"}]
dependencies = ["fastapi==0.141.1", "pydantic==2.13.4", "uvicorn==0.52.1", "psutil>=7,<8"]

[project.scripts]
signal-foundry = "signal_foundry.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "black==26.5.1",
  "ruff==0.15.21",
  "mypy>=2,<3",
  "PyYAML>=6,<7",
  "types-PyYAML>=6,<7",
  "seaborn>=0.13.2,<0.14",
  "pip-audit>=2.10.1,<3",
  "pip>=26.2,<27",
  "httpx2==2.12.0",
  "hypothesis>=6,<7",
  "pandas-stubs>=3,<4",
  "types-psutil>=7,<8",
]

[tool.setuptools.packages.find]
include = ["foundry_build*", "signal_foundry*"]

[tool.setuptools.package-data]
signal_foundry = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["seaborn"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Independently locked source packages are deliberately not root dependencies.
# Their public boundary is validated by typed wire contracts and real-worker tests.
module = ["alphaforge.*", "quant_platform.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
