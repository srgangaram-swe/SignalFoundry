[build-system]
requires = ["setuptools>=77", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-foundry"
version = "0.1.0"
description = "Local-first quantitative research assembly and provenance tooling"
requires-python = ">=3.12"
authors = [{name = "srgangaram-swe"}]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "black==26.5.1",
  "ruff==0.15.21",
  "mypy>=2,<3",
  "PyYAML>=6,<7",
  "types-PyYAML>=6,<7",
  "seaborn>=0.13.2,<0.14",
  "pip-audit>=2.10.1,<3",
  "pip>=26.2,<27",
]

[tool.setuptools.packages.find]
include = ["foundry_build*"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["seaborn"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
